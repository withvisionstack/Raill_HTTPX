[workspace]
members = ["rail-httpx-core", "rail-httpx-cli", "rail-httpx-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Postman leve + Burp core, em Rust. Cliente HTTP, proxy MITM, fuzzer, scanner e cliente de banco em um só binário."
repository = "https://github.com/withvisionstack/rail_httpx"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "stream"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "postgres", "mysql", "sqlite"] }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
colored = "2"
futures = "0.3"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui-phosphor = { version = "0.7", features = ["regular"] }
toml = "0.8"

# dev-deps compartilhadas
httpmock = "0.7"
tempfile = "3"

[profile.release]
opt-level = "z"     # otimiza pra tamanho (o default "3" otimiza pra velocidade)
lto = true          # link-time optimization: -20% a -30% no tamanho
codegen-units = 1   # melhor otimização, build um pouco mais lento
strip = true        # remove símbolos de debug: -40% no tamanho
panic = "abort"     # sem unwinding: menor, sem stack traces em panic



